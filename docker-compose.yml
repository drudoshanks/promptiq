services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promptiq
      POSTGRES_PASSWORD: promptiq
      POSTGRES_DB: promptiq
    ports:
      - "5432:5432"
    volumes:
      - promptiq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptiq -d promptiq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  promptiq-pgdata:
